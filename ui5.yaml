specVersion: "4.0"
metadata:
  name: ui5-shop
type: application
framework:
  name: OpenUI5
  version: "1.153.0"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.uxap
    - name: themelib_sap_horizon
server:
  customMiddleware:
  - name: ui5-middleware-serveframework
    afterMiddleware: compression
  - name: ui5-middleware-livereload
    afterMiddleware: compression
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /weather-api
    configuration:
      baseUri: "https://api.pirateweather.net/forecast/KEY_COMES_FROM_ENV"
      removeETag: true